# Railway cron worker. Attach a Postgres plugin to this service
# so DATABASE_URL is injected. Monday 02:00 UTC = Sunday evening US,
# using Friday's close rather than a live Monday session.
#
# First deploy: railway run python3 job.py --seed
# Then the schedule takes over.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
startCommand = "python3 job.py"
cronSchedule = "0 2 * * 1"
restartPolicyType = "NEVER"
